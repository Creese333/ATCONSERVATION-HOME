<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>@Conservation</title>
<meta name="description" content="Conservation tools for the Appalachian Trail corridor.">
<link rel="icon" href="images/icon-192.png">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://grid.trailassessment.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<!-- @Conservation home page. A 3D model of the Appalachian Trail at Harpers Ferry, the camera slowly circling, with the
     forest pest records for spotted lanternfly (the same records ACT animates under "Where are forest pests turning up?")
     appearing year by year. The map is made with atmap.js (terrain, imagery, the tile queue), a copy of ACT's own
     (Creese333/ATCONSERVATION); the records are read from the A.T. Resource Grid site, the trail from the NPS centerline
     service. The button opens ACT.
     Look: one frosted-glass card over the full-bleed map, system type set tight, the lanternfly floating above the card,
     and a segmented timeline that fills year by year (each segment in that year's dot color). Everything rises in on load. -->
<style>
:root{--ink:#F5F5F7;--sub:rgba(235,235,245,.62);--faint:rgba(235,235,245,.38);--accent:#FF9F0A;
  --glass:rgba(28,28,30,.58);--edge:rgba(255,255,255,.10);--ease:cubic-bezier(.22,.8,.24,1);
  --phen:#F0C419}   /* the yellow of ACT's phenology question (When does it flower here?) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#map{position:fixed;inset:0}
.maplibregl-ctrl-top-left{display:none}
/* the map credits sit small at the top right, out of the card's way */
.maplibregl-ctrl-bottom-right{top:calc(env(safe-area-inset-top) + 40px);bottom:auto;right:6px;max-width:48vw}
.maplibregl-map .maplibregl-ctrl.maplibregl-ctrl-attrib{font-size:8px;line-height:1.3;background:transparent;color:var(--faint);margin:0;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.maplibregl-ctrl-attrib a{color:var(--sub)}
/* the dark edges keep the words readable over the imagery */
#shade{position:fixed;inset:0;pointer-events:none;background:
  linear-gradient(180deg,rgba(0,0,0,.62) 0,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%)}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 0;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{margin:0;font-size:clamp(34px,8.6vw,54px);font-weight:700;letter-spacing:-.035em;line-height:1}
h1 .at{color:var(--phen)}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.35)}
/* the basemap switch: imagery or OpenStreetMap */
#bases{pointer-events:auto;display:flex;padding:2px;border-radius:999px;flex:none;position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px)}
#bases button{border:0;background:none;color:var(--sub);font:inherit;font-size:10px;font-weight:600;letter-spacing:-.01em;
  padding:4px 8px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s}
#bases button[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#1D1D1F}
#bases button:focus-visible{outline:2px solid #0A84FF;outline-offset:1px}
#panel{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
/* the lanternfly sits at the top left; drawn on a canvas (see the script) */
#brand{display:block}
#bug{width:clamp(160px,46vw,220px);margin:-6px 0 0 -10px;position:relative}
#slf3d{position:relative;width:100%;aspect-ratio:1}
#slf3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#slf3d img{display:none}
/* the drawing, shown only if the photo pieces fail to load */
#bug svg[hidden]{display:none}
#bug svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 14px rgba(0,0,0,.55))}
#card{pointer-events:auto;width:100%;max-width:290px;border-radius:18px;padding:13px 13px 10px}
#top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#year{font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;
  color:var(--phen)}
#count{font-size:10.5px;font-weight:500;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
#what{margin:3px 0 0;font-size:12px;line-height:1.35;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
/* the timeline: one segment a year, filled in that year's dot color; tap one to hold on that year */
#tl{display:flex;gap:3px;margin-top:7px}
#tl button{flex:1;min-width:0;border:0;background:none;padding:6px 0 0;cursor:pointer;color:var(--faint);font:inherit;font-size:8.5px;font-weight:600;
  font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:4px;align-items:center;transition:color .3s}
#tl button b{display:block;width:100%;height:2px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
#tl button b i{display:block;height:100%;width:0;border-radius:2px;background:var(--c)}
#tl button.now{color:var(--ink)}
#tl button.past{color:var(--sub)}
#tl.ends button span{visibility:hidden}
#tl.ends button:first-child span,#tl.ends button:last-child span,#tl.ends button.now span{visibility:visible}
#tl button:focus-visible{outline:2px solid #0A84FF;outline-offset:2px;border-radius:4px}
#go{pointer-events:auto;width:100%;max-width:290px;margin-bottom:8px}
#act{display:flex;align-items:center;justify-content:center;gap:10px;height:38px;box-shadow:0 8px 24px rgba(0,0,0,.3);border-radius:999px;
  background:var(--ink);color:#1D1D1F;font-weight:700;font-size:13px;letter-spacing:-.01em;text-decoration:none;
  transition:transform .25s var(--ease),background .25s}
#act span{font-weight:500;color:#3A3A3C}
#act svg{width:7px;height:11px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-left:2px}
#act:hover{background:#fff}
#act:active{transform:scale(.97)}
#act:focus-visible{outline:3px solid #0A84FF;outline-offset:3px}
#credit{margin:6px 0 0 4px;font-size:8px;line-height:1.35;color:var(--faint);text-align:left;max-width:290px}
#act{gap:6px} #act span{font-size:12px}
@media (max-width:340px){ #act span{display:none} }
@media (min-width:900px){
  #panel{padding-left:40px;padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}
  header{padding:20px 40px 0}
  .maplibregl-ctrl-bottom-right{top:auto;bottom:6px}
}
/* everything rises in, one after another */
.rise{opacity:0;animation:rise .9s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){ .rise{animation:fade .6s ease forwards} @keyframes fade{from{opacity:0}to{opacity:1}} }
</style>
<script>
/* if a lanternfly picture really fails to load (an error event, nothing else), the drawing takes its place */
function slfFail(){ if (window.slfGone) return; window.slfGone = true;
  const go = () => { const a = document.getElementById('slf3d'), d = document.getElementById('slfdraw');
    if (a) a.remove(); if (d) d.removeAttribute('hidden'); const c = document.getElementById('credit'); if (c) c.remove(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go(); }
</script>
</head>
<body>
<div id="map" aria-hidden="true"></div>
<div id="shade"></div>
<header>
  <div id="brand">
  <h1 class="vh">@Conservation</h1>
  <figure id="bug" class="rise" style="--d:.3s">
    <!-- the lanternfly in 3D: cut from the photo into a body and two wing pairs (images/slf-*.webp), the wings hinged at
         the thorax. Drawn on the canvas each frame with the 3D worked out in the script (no CSS 3D, which Safari draws
         differently); it sits still, and flutters (and lifts a little) only while the map is zooming. -->
    <div id="slf3d" role="img" aria-label="A spotted lanternfly, wings open">
      <canvas></canvas>
      <img class="wl" src="images/slf-wl.webp" alt="" onerror="slfFail()"><img class="wr" src="images/slf-wr.webp" alt="" onerror="slfFail()"><img class="b" src="images/slf-body.webp" alt="" onerror="slfFail()">
    </div>
    <!-- spotted lanternfly, wings open: grey forewings with black spots and a netted tip, red hindwings with black spots, a white band and black edges, yellow and black body -->
    <svg id="slfdraw" viewBox="0 0 260 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
        <defs>
          <radialGradient id="hw" cx="35%" cy="35%" r="80%"><stop offset="0" stop-color="#FF5A5F"/><stop offset=".55" stop-color="#D7263D"/><stop offset="1" stop-color="#7E0F1E"/></radialGradient>
          <linearGradient id="fw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6DCCB"/><stop offset=".55" stop-color="#C2B49C"/><stop offset="1" stop-color="#8D7F6A"/></linearGradient>
          <linearGradient id="ab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B98F12"/><stop offset=".5" stop-color="#FFD43B"/><stop offset="1" stop-color="#B98F12"/></linearGradient>
          <radialGradient id="shine" cx="40%" cy="30%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <radialGradient id="hd" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#0B0B0B"/></radialGradient>
          <pattern id="net" width="7" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h7M0 3h7M3.5 0v3M0 3v3M7 3v3" stroke="#4A3F33" stroke-width=".9" fill="none"/></pattern>
          <clipPath id="tipL"><path d="M128 92 C 96 70, 40 46, 14 64 C 4 72, 10 92, 30 102 C 62 116, 104 112, 128 104 Z"/></clipPath>
          <clipPath id="tipR"><path d="M132 92 C 164 70, 220 46, 246 64 C 256 72, 250 92, 230 102 C 198 116, 156 112, 132 104 Z"/></clipPath>
        </defs>
        <ellipse cx="130" cy="196" rx="70" ry="8" fill="#000" opacity=".25"/>
        <!-- hindwings -->
        <g class="wl">
          <path d="M126 100 C 98 104, 52 116, 40 140 C 32 158, 48 176, 74 172 C 100 168, 120 140, 128 112 Z" fill="url(#hw)"/>
          <path d="M60 150 C 54 162, 60 172, 74 172 C 92 169, 104 156, 112 146 C 96 146, 74 146, 60 150 Z" fill="#141414"/>
          <path d="M66 145 C 80 141, 98 141, 113 143" stroke="#F4F1EA" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="104" cy="114" r="4.5" fill="#141414"/><circle cx="90" cy="122" r="4" fill="#141414"/><circle cx="110" cy="126" r="3.6" fill="#141414"/><circle cx="76" cy="128" r="3.4" fill="#141414"/>
          <path d="M126 100 C 98 104, 52 116, 40 140 C 32 158, 48 176, 74 172 C 100 168, 120 140, 128 112 Z" fill="url(#shine)"/>
        </g>
        <g class="wr">
          <path d="M134 100 C 162 104, 208 116, 220 140 C 228 158, 212 176, 186 172 C 160 168, 140 140, 132 112 Z" fill="url(#hw)"/>
          <path d="M200 150 C 206 162, 200 172, 186 172 C 168 169, 156 156, 148 146 C 164 146, 186 146, 200 150 Z" fill="#141414"/>
          <path d="M194 145 C 180 141, 162 141, 147 143" stroke="#F4F1EA" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="156" cy="114" r="4.5" fill="#141414"/><circle cx="170" cy="122" r="4" fill="#141414"/><circle cx="150" cy="126" r="3.6" fill="#141414"/><circle cx="184" cy="128" r="3.4" fill="#141414"/>
          <path d="M134 100 C 162 104, 208 116, 220 140 C 228 158, 212 176, 186 172 C 160 168, 140 140, 132 112 Z" fill="url(#shine)"/>
        </g>
        <!-- forewings -->
        <g class="wl">
          <path d="M128 92 C 96 70, 40 46, 14 64 C 4 72, 10 92, 30 102 C 62 116, 104 112, 128 104 Z" fill="url(#fw)" stroke="#6E6252" stroke-width="1"/>
          <g clip-path="url(#tipL)"><rect x="0" y="40" width="44" height="80" fill="url(#net)" opacity=".9"/></g>
          <g fill="#151515"><circle cx="110" cy="92" r="4.2"/><circle cx="96" cy="84" r="3.8"/><circle cx="98" cy="100" r="3.6"/><circle cx="82" cy="78" r="3.4"/><circle cx="80" cy="96" r="3.8"/><circle cx="66" cy="86" r="3.2"/><circle cx="64" cy="100" r="3"/><circle cx="52" cy="78" r="2.8"/></g>
          <path d="M128 92 C 96 70, 40 46, 14 64 C 4 72, 10 92, 30 102 C 62 116, 104 112, 128 104 Z" fill="url(#shine)"/>
        </g>
        <g class="wr">
          <path d="M132 92 C 164 70, 220 46, 246 64 C 256 72, 250 92, 230 102 C 198 116, 156 112, 132 104 Z" fill="url(#fw)" stroke="#6E6252" stroke-width="1"/>
          <g clip-path="url(#tipR)"><rect x="216" y="40" width="44" height="80" fill="url(#net)" opacity=".9"/></g>
          <g fill="#151515"><circle cx="150" cy="92" r="4.2"/><circle cx="164" cy="84" r="3.8"/><circle cx="162" cy="100" r="3.6"/><circle cx="178" cy="78" r="3.4"/><circle cx="180" cy="96" r="3.8"/><circle cx="194" cy="86" r="3.2"/><circle cx="196" cy="100" r="3"/><circle cx="208" cy="78" r="2.8"/></g>
          <path d="M132 92 C 164 70, 220 46, 246 64 C 256 72, 250 92, 230 102 C 198 116, 156 112, 132 104 Z" fill="url(#shine)"/>
        </g>
        <!-- body -->
        <ellipse cx="130" cy="132" rx="11" ry="34" fill="url(#ab)"/>
        <g stroke="#1A1A1A" stroke-width="3.2" fill="none" stroke-linecap="round"><path d="M120 116 h20"/><path d="M119 127 h22"/><path d="M119 138 h22"/><path d="M120 149 h20"/><path d="M123 159 h14"/></g>
        <ellipse cx="130" cy="132" rx="11" ry="34" fill="url(#shine)"/>
        <ellipse cx="130" cy="94" rx="13" ry="16" fill="url(#hd)"/>
        <ellipse cx="130" cy="74" rx="9" ry="8" fill="url(#hd)"/>
        <circle cx="125" cy="71" r="2" fill="#C23B22"/><circle cx="135" cy="71" r="2" fill="#C23B22"/>
        <path d="M125 68 C 120 60, 116 56, 110 54 M135 68 C 140 60, 144 56, 150 54" stroke="#2A2A2A" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="126" cy="88" rx="4" ry="6" fill="#fff" opacity=".18"/>
      </svg>
  </figure>
  </div>
  <div id="bases" class="glass rise" style="--d:.15s" role="group" aria-label="Basemap"><button type="button" data-b="img" aria-pressed="false">Imagery</button><button type="button" data-b="osm" aria-pressed="true">OpenStreetMap</button></div>
</header>
<main id="panel">
  <div id="go" class="rise" style="--d:.25s">  <a id="act" href="https://act.atconservation.com/">ACT <span>Appalachian Conservation Tool</span><svg viewBox="0 0 9 14" aria-hidden="true"><path d="M1.5 1.5l6 5.5-6 5.5"/></svg></a>
  </div>
  <section id="card" class="glass rise" style="--d:.3s">
    <div id="top"><div id="year" aria-live="polite">&nbsp;</div><div id="count">&nbsp;</div></div>
    <p id="what">Spotted lanternfly along the Appalachian Trail at Harpers Ferry, year by year</p>
    <div id="tl" aria-label="Years"></div>
  </section>
  <p id="credit" class="rise" style="--d:.6s">Adapted from a photo by Lawrence Barringer, Pennsylvania Department of Agriculture, Bugwood.org</p>
</main>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="atmap.js"></script>
<script>
(function(){
'use strict';
const SRC = window.AT_SRC || 'https://grid.trailassessment.org/';
const SVC = 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/';
/* the section of trail shown: Harpers Ferry, where the trail crosses the Potomac between Loudoun Heights and South Mountain */
const BOX = [-77.85, 39.15, -77.45, 39.55], CENTER = [39.318, -77.735];
/* with Reduce Motion on, the camera holds still and the years show the latest; zooming still sets the wings fluttering */
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
let playing = !STILL;
const hooks = [];   /* called with the new playing state */
let resume = 0;
const setPlay = on => { playing = on; hooks.forEach(f => f(on)); };

/* the lanternfly, drawn frame by frame on the canvas. The three pieces (650 x 430, lined up) are placed in 3D and
   projected straight on (orthographic), which a 2D canvas transform does exactly: the insect lies tilted back by t from
   face-on, and each wing pair turns up about its hinge (the line along the body at x = 283 or 363) by a.
   A point dx from the hinge then lands at x = dx cos a, y = y cos t -/+ dx sin a sin t (it rises as the wing lifts). */
(function bug(){
  const box = document.getElementById('slf3d'); if (!box) return;
  const cv = box.querySelector('canvas'), ctx = cv.getContext('2d'), im = k => box.querySelector('img.' + k);
  const WL = im('wl'), WR = im('wr'), BD = im('b'), W = 650, H = 430, HL = 283.4, HR = 362.7, CW = 640, CH = 640;
  /* turned 28 degrees clockwise so the wings run diagonally, the left pair toward the top-left corner; scaled so the
     insect (to 360 from its center, wings raised included) stays inside the square canvas at any angle */
  const ROT = 28 * Math.PI / 180, S = .8;
  /* the flutter: energy e rises fast while the map zooms and dies away about a third of a second after it stops;
     the wings beat 9 times a second, their swing growing with e; with e at 0 the insect rests and nothing is redrawn */
  const ready = () => [WL, WR, BD].every(i => i.complete && i.naturalWidth);
  let t = 0, last = 0, dpr = 0, e = 0, kick = -1e9, drawn = false, pend = false;
  window.slfBuzz = () => { kick = performance.now(); pend = true; };   /* pend: the next frame flutters even if it comes late */
  const size = () => { const r = window.devicePixelRatio || 1, w = Math.round(cv.clientWidth * r), h = Math.round(cv.clientHeight * r);
    if (w && (cv.width !== w || cv.height !== h)){ cv.width = w; cv.height = h; drawn = false; } dpr = cv.width / CW; };
  const frame = now => {
    requestAnimationFrame(frame);
    if (!ready()) return;
    const dt = last ? Math.min(.1, (now - last) / 1000) : 0; last = now;
    const want = pend || performance.now() - kick < 250 ? 1 : 0, e0 = e; pend = false;
    e += (want - e) * (1 - Math.exp(-Math.max(dt, .016) / (want ? .06 : .3))); if (!want && e < .004) e = 0;
    size();
    if (drawn && e === 0 && e0 === 0) return;
    drawn = true; t += dt;
    const P = Math.PI * 2, R = Math.PI / 180;
    const tilt = 40 * R, rz = 3 * e * Math.sin(P * t * 1.7) * R, up = 4 + 16 * e;
    const a = (4 + e * (30 + 28 * Math.sin(P * 9 * t))) * R, ct = Math.cos(tilt), st = Math.sin(tilt), ca = Math.cos(a), sa = Math.sin(a);
    size();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    /* the shadow under it, turned with it, softer and smaller as the insect rises */
    const sx = CW / 2, sy = CH / 2 + 70, sw = 250 * S * (1 - up / 90);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.translate(sx, sy); ctx.rotate(ROT); ctx.scale(1, .26);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, sw);
    g.addColorStop(0, 'rgba(0,0,0,' + (.5 - up / 80).toFixed(3) + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, sw, 0, P); ctx.fill();
    /* the insect: centered, lifted by up, turned by ROT (and a little rz while it flutters) */
    const cx = CW / 2, cy = CH / 2 - 6 - up;
    const base = () => { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.translate(cx, cy); ctx.rotate(ROT + rz); ctx.scale(S, S); };
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6 * dpr; ctx.shadowOffsetY = 2 * dpr;
    /* left wings: x from the hinge (negative) maps to x cos a, and rises by -x sin a sin t */
    base(); ctx.translate(HL - W / 2, 0); ctx.transform(ca, -(-sa * st), 0, ct, 0, 0);
    ctx.transform(1, 0, 0, 1, 0, 0); ctx.drawImage(WL, -HL, -H / 2, W, H);
    base(); ctx.translate(HR - W / 2, 0); ctx.transform(ca, -sa * st, 0, ct, 0, 0); ctx.drawImage(WR, -HR, -H / 2, W, H);
    base(); ctx.transform(1, 0, 0, ct, 0, 0); ctx.drawImage(BD, -W / 2, -H / 2, W, H);
    ctx.shadowColor = 'transparent';
  };
  requestAnimationFrame(frame);
})();

const map = window.__MAP = new ATMap('map', {minZoom:9, maxZoom:16, base:'osm'});
map.ready(() => {
  map.setView(CENTER, 12.4);
  map.set3D(true, {animate:false});
  map.ml.jumpTo({pitch:64, bearing:-28});
  map.ml.on('zoom', () => window.slfBuzz && window.slfBuzz());   /* zooming sets the lanternfly fluttering */
  /* the trail: a soft glow under a white line */
  const trail = new G.Overlay(map, 'hometrail', 'trail', [
    {type:'line', layout:{'line-join':'round', 'line-cap':'round'}, paint:{'line-color':'#FFFFFF', 'line-width':9, 'line-opacity':.18, 'line-blur':4}},
    {type:'line', layout:{'line-join':'round', 'line-cap':'round'}, paint:{'line-color':'#FFFFFF', 'line-width':2.6}}]);
  const q = new URLSearchParams({where:'1=1', geometry:BOX.join(','), geometryType:'esriGeometryEnvelope', inSR:4326, spatialRel:'esriSpatialRelIntersects',
    outFields:'OBJECTID', outSR:4326, f:'geojson', maxAllowableOffset:'0.00005', geometryPrecision:5});
  /* the basemap switch; the trail is white over imagery and dark green over the light street map */
  const TRAILC = {img:['#FFFFFF', .18], osm:['#14532D', .25]};
  const setBase = k => { map.setBase(k); document.querySelectorAll('#bases button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.b === k)));
    const [c, o] = TRAILC[k] || TRAILC.img; trail.ids.forEach((id, i) => { map.ml.setPaintProperty(id, 'line-color', c); if (!i) map.ml.setPaintProperty(id, 'line-opacity', o); }); };
  document.querySelectorAll('#bases button').forEach(b => b.addEventListener('click', () => setBase(b.dataset.b)));
  setBase('osm');
  fetch(SVC + 'ANST_Centerline/FeatureServer/0/query?' + q).then(r => r.ok ? r.json() : null).then(j => { if (j && j.features) trail.set(j); }).catch(() => {});
  /* the records: every year so far in its color, this year's larger and glowing */
  const RAMP = ['#7A1F12', '#C2410C', '#F97316', '#FFB347', '#FFE08A'];
  const recs = new G.Overlay(map, 'slf', 'feat', [
    {type:'circle', paint:{'circle-radius':['interpolate', ['linear'], ['zoom'], 9, 2, 14, 5], 'circle-color':['get', 'c'], 'circle-opacity':.9, 'circle-stroke-color':'#1A0D06', 'circle-stroke-width':.6, 'circle-pitch-alignment':'map'}},
    {type:'circle', paint:{'circle-radius':['interpolate', ['linear'], ['zoom'], 9, 6, 14, 14], 'circle-color':'#FFE08A', 'circle-opacity':.35, 'circle-blur':.9, 'circle-pitch-alignment':'map'}}]);
  fetch(SRC + 'data/phen/lycorma-delicatula.json').then(r => r.json()).then(d => {
    /* each record: [day of year, year, ..., lat, lon, ...] */
    const pts = (d.pts || []).filter(p => p[4] >= BOX[0] && p[4] <= BOX[2] && p[3] >= BOX[1] && p[3] <= BOX[3]);
    if (!pts.length) return;
    const years = [...new Set(pts.map(p => p[1]))].sort((a, b) => a - b), y0 = years[0], y1 = years[years.length - 1];
    const col = y => RAMP[Math.round((y - y0) / Math.max(1, y1 - y0) * (RAMP.length - 1))];
    recs.set({type:'FeatureCollection', features:pts.map(p => ({type:'Feature', properties:{y:p[1], c:col(p[1])}, geometry:{type:'Point', coordinates:[p[4], p[3]]}}))});
    /* the timeline */
    const tl = $('tl'); tl.classList.toggle('ends', years.length > 8);
    const segs = years.map(y => { const b = document.createElement('button'); b.type = 'button'; b.style.setProperty('--c', col(y));
      b.setAttribute('aria-label', String(y)); b.innerHTML = '<b><i></i></b><span>' + y + '</span>'; tl.appendChild(b); return b; });
    const HOLD = 1700, END = 4500;
    let cur = years.length - 1, timer = 0;
    const show = (i, run) => { cur = i; const y = years[i];
      map.ml.setFilter(recs.ids[0], ['<=', ['get', 'y'], y]); map.ml.setFilter(recs.ids[1], ['==', ['get', 'y'], y]);
      const n = pts.filter(p => p[1] <= y).length;
      const yr = $('year'); if (yr.textContent !== String(y)){ yr.textContent = y;
        if (yr.animate && !STILL) yr.animate([{opacity:0, transform:'translateY(10px)', filter:'blur(6px)'}, {opacity:1, transform:'none', filter:'blur(0)'}], {duration:550, easing:'cubic-bezier(.22,.8,.24,1)'}); }
      $('count').textContent = n.toLocaleString() + ' record' + (n === 1 ? '' : 's') + ' since ' + y0;
      segs.forEach((s, k) => { s.className = k < i ? 'past' : k === i ? 'now' : ''; s.setAttribute('aria-current', k === i ? 'true' : 'false');
        const f = s.firstChild.firstChild; f.style.transition = 'none'; f.style.width = k < i ? '100%' : '0';
        if (k === i){ if (run){ void f.offsetWidth; f.style.transition = 'width ' + (i === years.length - 1 ? END : HOLD) + 'ms linear'; } f.style.width = '100%'; } }); };
    const step = () => { clearTimeout(timer); if (!playing) return; const i = cur;
      show(i, true); timer = setTimeout(() => { cur = i === years.length - 1 ? 0 : i + 1; step(); }, i === years.length - 1 ? END : HOLD); };
    segs.forEach((s, k) => s.addEventListener('click', () => { if (playing) setPlay(false); clearTimeout(timer); show(k, false);   /* a tapped year holds 8 s, then the years play on */
      clearTimeout(resume); if (!STILL) resume = setTimeout(() => setPlay(true), 8000); }));
    hooks.push(on => { clearTimeout(timer); if (on){ if (cur === years.length - 1) cur = 0; step(); } else show(cur, false); });
    if (playing){ cur = 0; step(); } else show(cur, false);
  }).catch(() => { $('what').textContent = 'Spotted lanternfly along the Appalachian Trail at Harpers Ferry'; });
  /* the camera circles slowly, a degree a second, turned a little each frame. Touching, clicking or scrolling the map
     pauses it for 9 s. (Not rotateTo and map.stop(): stopping an animation in a touch or wheel listener also cancels the
     pinch or scroll the person is starting, so the map would never zoom.) */
  let spin = false, idle = 0, lastT = 0;
  const turn = now => { requestAnimationFrame(turn); const dt = lastT ? Math.min(.1, (now - lastT) / 1000) : 0; lastT = now;
    if (spin && playing && dt && !map.ml.isMoving()) map.ml.setBearing(map.ml.getBearing() + dt); };
  const hold = () => { spin = false; clearTimeout(idle); idle = setTimeout(() => { spin = true; }, 9000); };
  ['mousedown', 'touchstart', 'wheel'].forEach(t => map.getContainer().addEventListener(t, hold, {passive:true, capture:true}));
  setTimeout(() => { spin = true; requestAnimationFrame(turn); }, 1200);
});
})();
</script>
